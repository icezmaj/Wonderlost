<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wonderlost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
/* Wonderlost design tokens.
   Layout: one full-bleed portrait stage. Status rides the top edge, every
   action sits in the thumb zone at the bottom, the world owns the middle. */
:root {
  color-scheme: dark;
  --night: #0d0a26;
  --deep: #07051a;
  --ink: #17133a;
  --panel: #211b54;
  --panel-hi: #2d2670;
  --line: rgba(255, 255, 255, 0.14);
  --text: #f7f2ff;
  --muted: #b7afe0;
  --spark: #ffcf5c;
  --spark-deep: #f59a23;
  --ember: #b86a0c;
  --mist: #7fe3d8;
  --rose: #ff8fa3;
  --good: #7be0a0;
  --danger: #ff6b81;
  --display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: radial-gradient(circle at 50% 30%, var(--ink), var(--deep));
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
[hidden] { display: none !important; }

#app { position: relative; height: 100%; margin: 0 auto; overflow: hidden; background: var(--night); box-shadow: 0 0 80px rgba(0, 0, 0, 0.6); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; font-size: calc(15px * var(--u, 1)); line-height: 1.35; font-weight: 700; }
#ui button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; pointer-events: auto; }
#ui button:focus-visible { outline: 3px solid var(--mist); outline-offset: 2px; }
#ui p { margin: 0; }
.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.25em; }

.layer {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 12px 16px;
  pointer-events: none;
}

/* ---------- shared pieces ---------- */
.eyebrow { font: 800 0.72em/1.1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist); }
.fine { font-size: 0.76em; color: var(--muted); }
.muted { color: var(--muted); }
.bar { display: block; height: 0.42em; border-radius: 99px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--mist), #c6faf4); transition: width 0.5s cubic-bezier(0.2, 0.9, 0.3, 1); }

#ui .btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45em;
  border: 0;
  border-radius: 999px;
  padding: 0.78em 1.4em;
  font: 900 1.05em/1 var(--body);
  color: #3b2500;
  background: linear-gradient(180deg, #ffeeb5 0%, var(--spark) 45%, #f7a52c 100%);
  box-shadow: 0 0.28em 0 var(--ember), 0 0.6em 1.2em rgba(245, 154, 35, 0.35), inset 0 0.12em 0 rgba(255, 255, 255, 0.7);
  transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
}
#ui .btn:active { transform: translateY(0.22em); box-shadow: 0 0.06em 0 var(--ember), 0 0.2em 0.5em rgba(245, 154, 35, 0.3), inset 0 0.12em 0 rgba(255, 255, 255, 0.7); }
#ui .btn-xl { font-size: 1.25em; padding: 0.9em 2em; }
#ui .btn-small { font-size: 0.84em; padding: 0.62em 1em; }
#ui .btn-ghost { background: rgba(255, 255, 255, 0.1); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
#ui .btn-ghost:active { box-shadow: inset 0 0 0 1.5px var(--line); }
#ui .btn-danger { background: linear-gradient(180deg, #ffb3c0, var(--danger)); color: #3a0613; box-shadow: 0 0.28em 0 #a8253d; }
#ui .wide { width: 100%; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  background: rgba(23, 19, 58, 0.74);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 0.36em 0.7em 0.36em 0.45em;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.pill small { font-size: 0.72em; color: var(--muted); font-weight: 800; }
.pill.small { font-size: 0.9em; }
.pill.bump { animation: bump 0.45s; }
#ui .round {
  flex: none;
  width: 2.6em;
  height: 2.6em;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: rgba(23, 19, 58, 0.74);
  display: grid;
  place-items: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.dot { position: absolute; top: -0.3em; right: -0.3em; width: 1em; height: 1em; border-radius: 50%; background: var(--rose); border: 2px solid var(--night); }
.rw { display: inline-flex; align-items: center; gap: 0.15em; margin-right: 0.45em; font-weight: 900; }
.rw-text { font-size: 0.86em; }

/* ---------- title ---------- */
.title { justify-content: space-between; align-items: center; text-align: center; }
.title-top { margin-top: 9%; }
.title .eyebrow { margin-bottom: 0.9em; }
.logo {
  font: 900 3.5em/0.95 var(--display);
  font-variation-settings: 'SOFT' 100;
  margin: 0;
  letter-spacing: -0.02em;
  color: #fff7e0;
  text-shadow: 0 0.06em 0 var(--ember), 0 0 0.7em rgba(255, 207, 92, 0.55);
}
.logo span { color: var(--spark); }
.title-bottom { display: flex; flex-direction: column; gap: 1em; align-items: center; margin-bottom: 6%; }
.case-line { font-weight: 700; }
.case-line b { font-weight: 900; }
.case-line small { display: block; color: var(--muted); font-size: 0.9em; }

/* ---------- home ---------- */
.top { display: flex; align-items: center; gap: 0.45em; }
.rank {
  display: flex;
  align-items: center;
  gap: 0.5em;
  flex: 1;
  min-width: 0;
  background: rgba(23, 19, 58, 0.74);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 0.26em 0.8em 0.26em 0.26em;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.rank-badge {
  flex: none;
  width: 2.05em;
  height: 2.05em;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 900 1em var(--display);
  color: #3b2500;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--spark) 55%, var(--spark-deep));
}
.rank-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 0.25em; }
.rank-name { font-weight: 800; font-size: 0.7em; line-height: 1.08; }

#ui .chip {
  margin-top: 0.6em;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 0.28em;
  border: 1.5px solid var(--line);
  border-radius: 1.1em;
  padding: 0.6em 0.85em 0.7em;
  background: linear-gradient(180deg, rgba(45, 38, 112, 0.88), rgba(28, 23, 72, 0.88));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 0.4em 1.2em rgba(0, 0, 0, 0.25);
}
.chip-kicker { font: 800 0.66em var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); }
.chip-text { font-weight: 800; font-size: 0.98em; }
.chip-foot { display: flex; align-items: center; gap: 0.6em; }
.chip-foot .bar { flex: 1; }
.chip-count { font-size: 0.78em; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip-reward { font-size: 0.86em; }
.chip-reward .rw { margin: 0 0 0 0.3em; }
#ui .chip.done { border-color: var(--spark); animation: ready 1.4s infinite; }
.chip.done .chip-count { color: var(--spark); }
.chip.done .bar i { background: linear-gradient(90deg, var(--spark), #fff3c4); }

#ui .event-badge {
  position: relative;
  align-self: flex-end;
  margin-top: 0.6em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.05em;
  padding: 0.45em 0.6em 0.4em;
  border-radius: 1em;
  border: 1.5px solid rgba(255, 207, 92, 0.5);
  background: linear-gradient(180deg, rgba(74, 47, 85, 0.9), rgba(28, 23, 72, 0.9));
  font-size: 0.74em;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.event-badge .ic { width: 2em; height: 2em; }

.spacer { flex: 1; }
.world-tag {
  align-self: center;
  display: flex;
  gap: 0.5em;
  align-items: baseline;
  margin-bottom: 0.7em;
  padding: 0.3em 0.95em;
  border-radius: 99px;
  background: rgba(13, 10, 38, 0.6);
  font-size: 0.82em;
}
.world-tag b { font: 800 1.2em var(--display); }
.world-tag span { color: var(--muted); }

.dock { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.6em; }
#ui .dock-btn {
  position: relative;
  flex: none;
  width: 4.7em;
  height: 4.7em;
  padding: 0;
  border-radius: 1.3em;
  border: 1.5px solid var(--line);
  background: linear-gradient(180deg, rgba(45, 38, 112, 0.94), rgba(28, 23, 72, 0.94));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2em;
  font-weight: 800;
  font-size: 0.82em;
  box-shadow: 0 0.3em 0 rgba(0, 0, 0, 0.3);
}
#ui .dock-btn:active { transform: translateY(0.2em); box-shadow: none; }
.dock-btn .ic { width: 1.9em; height: 1.9em; }
#ui .btn-dive { flex: 1; flex-direction: column; gap: 0.25em; padding: 0.7em 1em; font-size: 1.35em; border-radius: 1.3em; min-height: 3.45em; }
.dive-cost { display: inline-flex; align-items: center; gap: 0.2em; font-size: 0.6em; font-weight: 900; padding: 0.2em 0.6em 0.2em 0.4em; border-radius: 99px; background: rgba(59, 37, 0, 0.82); color: #fff3c4; }
.rbtns .dive-cost { font-size: 0.78em; }
#ui .btn-dive.practice { background: linear-gradient(180deg, #e2ddff, #a79df0 60%, #8478d8); box-shadow: 0 0.28em 0 #4d4398, inset 0 0.12em 0 rgba(255, 255, 255, 0.7); color: #1c1648; }
#ui .pulse { animation: ready 1.4s infinite; }

/* ---------- dive HUD ---------- */
.dive-hud { display: flex; justify-content: space-between; align-items: flex-start; }
.dh-left, .dh-right { display: flex; flex-direction: column; gap: 0.4em; }
.dh-right { align-items: flex-end; padding-top: 0.2em; }
.pill.big { font-size: 1.25em; }
.chain { display: flex; align-items: baseline; gap: 0.35em; font-weight: 800; font-size: 0.8em; color: var(--muted); opacity: 0.45; transition: opacity 0.2s; padding-left: 0.4em; }
.chain b { font-size: 1.5em; color: var(--text); font-variant-numeric: tabular-nums; }
.chain em { font-style: normal; font-weight: 900; font-size: 1.4em; }
.chain.live { opacity: 1; }
.chain.t2 em { color: var(--mist); }
.chain.t3 em { color: var(--spark); }
.chain.t4 em { color: var(--rose); }
.pips { display: flex; gap: 0.35em; }
.lp { width: 1em; height: 1.3em; border-radius: 0.4em; background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.2); }
.lp.on { background: linear-gradient(#fff3c4, #ff9d2e); box-shadow: 0 0 0.7em rgba(255, 207, 92, 0.9); }
.rp { display: grid; opacity: 0.22; filter: grayscale(1); }
.rp.on { opacity: 1; filter: none; }
.rp .ic { width: 1.35em; height: 1.35em; }
.practice-tag { align-self: center; margin-top: 0.5em; padding: 0.3em 0.9em; border-radius: 99px; background: rgba(13, 10, 38, 0.7); font-size: 0.78em; color: var(--muted); }

.hint {
  position: absolute;
  left: var(--gl);
  right: var(--gr);
  bottom: 19%;
  margin: 0 auto;
  max-width: 19em;
  text-align: center;
  padding: 0.7em 1em;
  border-radius: 1em;
  background: rgba(13, 10, 38, 0.86);
  border: 1.5px solid rgba(255, 207, 92, 0.55);
  font-weight: 800;
  animation: floaty 2.2s ease-in-out infinite;
}

/* ---------- sheets ---------- */
.scrim { position: absolute; inset: 0; background: rgba(8, 6, 26, 0.55); pointer-events: auto; }
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 75%;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #2a2468, #1b1648);
  border-radius: 1.6em 1.6em 0 0;
  border-top: 1.5px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 -1em 3em rgba(0, 0, 0, 0.5);
  pointer-events: auto;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 0.4em 16px;
  transform: translateY(100%);
}
.sheet.in { transform: none; transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1); }
.sh-head { display: flex; justify-content: space-between; align-items: center; gap: 1em; padding: 0.7em 0 0.6em; }
.sh-head h2 { font: 800 1.5em/1.1 var(--display); margin: 0.15em 0 0; text-wrap: balance; }
.sh-progress { display: flex; align-items: center; gap: 0.7em; font-size: 0.82em; font-weight: 800; color: var(--muted); padding-bottom: 0.7em; }
.sh-progress .bar { flex: 1; }
.sh-body { overflow-y: auto; display: flex; flex-direction: column; gap: 0.6em; padding-bottom: 0.4em; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; min-height: 0; scrollbar-width: none; }
.sh-body::-webkit-scrollbar, .rcard::-webkit-scrollbar { display: none; }
.sh-body > * { flex: none; }

.up { display: flex; align-items: center; gap: 0.8em; padding: 0.75em 0.8em; border-radius: 1.1em; background: rgba(255, 255, 255, 0.06); border: 1.5px solid var(--line); }
.up-main { flex: 1; min-width: 0; }
.up-title { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; }
.up-title b { font-size: 1.02em; font-weight: 900; }
.up-main p { margin-top: 0.15em; font-size: 0.82em; color: var(--muted); }
.up-main .up-note { color: var(--mist); }
.lvl { display: inline-flex; gap: 0.22em; }
.lvl i { width: 0.6em; height: 0.6em; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
.lvl i.on { background: var(--spark); box-shadow: 0 0 0.4em rgba(255, 207, 92, 0.8); }
#ui .btn-buy { flex: none; font-size: 0.95em; padding: 0.68em 0.9em; min-width: 5.2em; }
#ui .btn-buy.poor { filter: saturate(0.2) brightness(0.78); }
.up.locked { opacity: 0.6; }
.up.maxed { border-color: rgba(123, 224, 160, 0.4); }
.up-state { flex: none; display: flex; flex-direction: column; align-items: center; gap: 0.15em; color: var(--muted); font-weight: 800; width: 5.2em; text-align: center; }
.up-state small { font-size: 0.68em; line-height: 1.15; }
.up-state.ok { color: var(--good); }
.soon { margin-top: 0.3em; padding: 0.8em; border-radius: 1.1em; border: 1.5px dashed var(--line); display: flex; flex-direction: column; gap: 0.5em; }
.soon-row { display: flex; flex-direction: column; font-size: 0.84em; }
.soon-row b { font: 800 1.1em var(--display); }
.soon-row span { color: var(--muted); }
.lead { font-size: 1.02em; font-weight: 800; }

.tabs { display: flex; gap: 0.4em; padding: 0.2em; margin-bottom: 0.7em; background: rgba(0, 0, 0, 0.22); border-radius: 99px; }
#ui .tab { flex: 1; border: 0; border-radius: 99px; padding: 0.6em; font-weight: 900; background: transparent; color: var(--muted); }
#ui .tab.on { background: var(--panel-hi); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }

.cre { display: flex; gap: 0.8em; padding: 0.8em; border-radius: 1.1em; background: rgba(255, 255, 255, 0.06); border: 1.5px solid var(--line); }
.cre.active { border-color: var(--mist); background: rgba(127, 227, 216, 0.08); }
.cre-art, .rfind-art { flex: none; width: 4.6em; height: 4.6em; border-radius: 1em; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #4a3f9c, #231c5c); overflow: hidden; }
.cre-art span { font: 900 2em var(--display); color: rgba(255, 255, 255, 0.3); }
.cre-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.32em; align-items: flex-start; }
.cre-top { display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap; }
.cre-top b { font: 800 1.15em var(--display); }
.rar { font-size: 0.64em; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.25em 0.6em; border-radius: 99px; background: rgba(255, 255, 255, 0.12); color: var(--muted); }
.cre-body p { font-size: 0.84em; color: var(--muted); }
.cre-body .abil { color: var(--text); }
.abil b { color: var(--spark); }
.bond { display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap; }
.hearts { display: inline-flex; gap: 0.15em; color: rgba(255, 255, 255, 0.2); }
.hearts i { display: grid; }
.hearts i.on { color: var(--rose); }
.bond small { font-size: 0.74em; color: var(--muted); }
.notes { margin: 0; padding-left: 1.1em; font-size: 0.8em; color: var(--muted); font-style: italic; }
.tag { display: inline-flex; align-items: center; gap: 0.3em; font-size: 0.8em; font-weight: 900; color: var(--mist); }

.set-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.1em 0.6em; margin-top: 0.3em; }
.set-head b { font: 800 1.05em var(--display); min-width: 0; }
.set-head span { font-size: 0.76em; color: var(--muted); font-weight: 800; text-align: right; }
.set-reward { font-size: 0.82em; color: var(--mist); font-weight: 800; }
.art-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5em; }
#ui .art { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0.2em; padding: 0.6em 0.3em; border-radius: 1em; border: 1.5px solid var(--line); background: rgba(255, 255, 255, 0.05); min-width: 0; }
.art small { font-size: 0.7em; font-weight: 800; color: var(--muted); text-align: center; line-height: 1.15; }
#ui .art.owned { background: rgba(255, 207, 92, 0.1); border-color: rgba(255, 207, 92, 0.4); }
.art.owned small { color: var(--text); }
#ui .art.sel { box-shadow: 0 0 0 2px var(--mist); }
.count { position: absolute; top: 0.3em; right: 0.5em; font-style: normal; font-size: 0.72em; font-weight: 900; color: var(--spark); }
.art-detail { min-height: 4.4em; padding: 0.7em 0.8em; border-radius: 1em; background: rgba(0, 0, 0, 0.2); font-size: 0.86em; display: flex; flex-direction: column; gap: 0.3em; align-items: flex-start; }
.art-detail p { color: var(--muted); }
.echo-row { display: flex; align-items: center; gap: 0.5em; font-size: 0.8em; color: var(--muted); }
.echo-row b { color: var(--text); font-size: 1.25em; }
.trails { display: flex; flex-wrap: wrap; gap: 0.4em; }
#ui .trail { display: inline-flex; align-items: center; gap: 0.4em; border: 1.5px solid var(--line); border-radius: 99px; padding: 0.4em 0.8em 0.4em 0.45em; background: rgba(255, 255, 255, 0.05); font-weight: 800; font-size: 0.84em; }
.trail i { width: 2.2em; height: 0.8em; border-radius: 99px; }
#ui .trail.sel { border-color: var(--spark); background: rgba(255, 207, 92, 0.12); }
#ui .trail.locked { opacity: 0.45; cursor: default; }
.odds { font-size: 0.8em; color: var(--muted); border-radius: 1em; background: rgba(0, 0, 0, 0.2); padding: 0.65em 0.85em; pointer-events: auto; }
.odds summary { font-weight: 900; color: var(--text); cursor: pointer; }
.odds ul { margin: 0.5em 0 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 0.35em; }
.odds b { color: var(--text); }

.ev { padding: 0.9em; border-radius: 1.2em; background: linear-gradient(160deg, rgba(255, 143, 163, 0.16), rgba(255, 207, 92, 0.1)); border: 1.5px solid rgba(255, 207, 92, 0.35); display: flex; flex-direction: column; gap: 0.45em; }
.ev h3 { font: 800 1.3em/1.1 var(--display); margin: 0; }
.ev > p { font-size: 0.86em; color: var(--muted); }
.ev .eyebrow { color: var(--spark); }
.ev.locked { flex-direction: row; align-items: center; gap: 0.7em; color: var(--muted); border-style: dashed; background: none; border-color: var(--line); }

      p.y -= 26 * dt;

  }

  clear() {
    this.list.length = 0;
  }
}

  function drawTeapot(g, st) {

  function drawVillage(g, st) {

      g.lineTo(184, 102);

      g.moveTo(164, 58);
      g.lineTo(180, 32);
      g.lineTo(196, 58);
      g.closePath();
      g.fill();
      if (gh) return;
      g.fillStyle = '#35296a';
      g.beginPath();
      g.moveTo(174, 78);
      g.lineTo(174, 68);
      g.arc(180, 68, 6, Math.PI, 0);
      g.lineTo(186, 78);
      g.fill();
      g.fillStyle = bell >= 2 ? '#ffcf5c' : '#b9b3d9';
      g.beginPath();
      g.moveTo(175.5, 76);
      g.quadraticCurveTo(176, 66, 180, 66);
      g.quadraticCurveTo(184, 66, 184.5, 76);
      g.fill();
      if (bell >= 2) {
        g.strokeStyle = '#efe6ff';
        g.lineWidth = 1.2;
        g.beginPath();
        g.moveTo(180, 32);
        g.lineTo(180, 20);
        g.stroke();
        g.fillStyle = '#ff8fa3';
        g.beginPath();
        g.moveTo(180, 20);
        g.lineTo(191, 23.5);

    });

    // --- Cloud Cottages (teacup houses) ---
    const cots = L('cottages');
    if (!slot(g, 'mw_cottages_' + cots)) CUP_SPOTS.forEach(([x, y, col, trim], i) => cup(g, x, y, col, trim, cots >= 3 || (cots >= 2 && i === 0), i >= cots));

    // --- Steam Garden ---
    const gar = L('garden');
    if (!slot(g, 'mw_garden_' + gar)) ghost(g, gar > 0, (gh) => {
      const n = gh ? 2 : gar + 1;
      for (let i = 0; i < n; i++) {
        const [x, y] = BUSH_SPOTS[i];
        g.fillStyle = gh ? '#9d98d6' : '#3fa66b';
        circle(g, x - 5, y, 6);
        circle(g, x + 5, y, 6);
        g.fillStyle = gh ? '#9d98d6' : '#63c98a';
        circle(g, x, y - 4, 7);

          g.fillStyle = '#ffffff';
          circle(g, x - 3, y - 6, 1.3);

        }
      }
      if (gh) return;

    g.fillStyle = hearth ? '#8e86bd' : '#57527f';

    g.fillStyle = hearth ? '#cfc8ee' : '#6b6596';

    g.fillStyle = hearth ? '#e6e0fb' : '#7a74a6';

    g.fillStyle = hearth ? '#ffb347' : '#1f183f';
    ellipse(g, 180, 247, 16, 4.6);
    if (hearth >= 2) {
      g.fillStyle = '#7a5ea8';
      g.fillRect(160, 222, 3, 25);
      g.fillRect(197, 222, 3, 25);

      g.beginPath();
      g.moveTo(151, 225);
      g.lineTo(180, 205);
      g.lineTo(209, 225);

  }

  function rebuild(st, px) {
    const mk = () => {
      const c = document.createElement('canvas');
      c.width = Math.round(geom.W * px);
      c.height = Math.round(geom.H * px);
      const g = c.getContext('2d');
      g.scale(px, px);
      return [c, g];
    };
    let g;
    [bg, g] = mk();
    drawBackdrop(g, st);
    g.translate(geom.ox, geom.oy);
    g.scale(geom.s, geom.s);
    drawTeapot(g, st);
    [village, g] = mk();
    g.translate(geom.ox, geom.oy);
    g.scale(geom.s, geom.s);
    drawVillage(g, st);
  }

  // ------------------------------------------------------------ per frame

  function update(dt) {
    t += dt;
    const st = getState();
    const p = restoration(st);
    fx.update(dt);

    // steam rising from the teapot's opening and spout
    if (Math.random() < dt * (3 + p * 6)) {
      const spout = Math.random() < 0.25;
      steam.push({
        x: spout ? 328 : 180 + (Math.random() - 0.5) * 60,
        y: spout ? 342 : 336,
        vx: spout ? 8 : (Math.random() - 0.5) * 6,
        vy: -(10 + Math.random() * 12),
        r: 6 + Math.random() * 6,
        life: 1,
        village: false
      });
    }
    if (upgradeLevel(st, 'garden') > 0 && Math.random() < dt * 3) {
      steam.push({ x: 288, y: 178, vx: (Math.random() - 0.5) * 5, vy: -16, r: 3, life: 1, village: true });
    }
    for (let i = steam.length - 1; i >= 0; i--) {
      const s = steam[i];
      s.life -= dt * 0.42;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.r += dt * 5;
      if (s.life <= 0) steam.splice(i, 1);
    }
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.life -= dt;
      h.y -= 26 * dt;
      h.x += Math.sin(h.life * 8) * 12 * dt;
      if (h.life <= 0) hearts.splice(i, 1);
    }

    // creatures potter about
    for (const id of ['nimbit', 'sprigget']) {
      const c = critters[id];
      c.hop = Math.max(0, c.hop - dt * 2.4);
      c.happy = Math.max(0, c.happy - dt);
      if (c.pause > 0) {
        c.pause -= dt;
        continue;
      }
      c.x += c.dir * 9 * dt;
      if (c.x > c.max) c.dir = -1;
      if (c.x < c.min) c.dir = 1;
      if (Math.random() < dt * 0.35) {
        c.pause = 0.8 + Math.random() * 2.2;
        if (Math.random() < 0.4) c.dir *= -1;
      }
    }
    const w = critters.whistlewing;
    w.phase += dt * 0.9;
    w.hop = Math.max(0, w.hop - dt * 2.4);
    w.happy = Math.max(0, w.happy - dt);
    w.x = 180 + Math.cos(w.phase) * 48;
    w.y = 56 + Math.sin(w.phase * 2) * 9;
  }

  function draw(ctx, W, H, px) {
    const st = getState();
    const k = [W, H, px, assetVersion(), st.setRewarded, ...Object.keys(ANCHOR).map((id) => upgradeLevel(st, id))].join(',');
    if (k !== key) {
      fit(W, H);
      rebuild(st, px);
      key = k;
    }
    const bob = bobNow();
    const p = restoration(st);
    const L = (id) => upgradeLevel(st, id);

    ctx.drawImage(bg, 0, 0, W, H);

    ctx.save();
    ctx.translate(geom.ox, geom.oy);
    ctx.scale(geom.s, geom.s);

    // light inside the teapot
    additive(ctx, () => {

  return [(e.clientX - r.left) / view.scale, (e.clientY - r.top) / view.scale];
}

stage.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  resumeAudio();
  const [x, y] = local(e);
  if (app.screen === 'dive') {
    try {
      stage.setPointerCapture(e.pointerId);
    } catch (err) {
      /* not critical */
    }
    dive.pointerDown(x, y);
  } else if (app.screen === 'home' && !app.ui.blocking()) {
    const id = app.world.tap(x, y);
    if (id) {
      petCreature(app.state);
      sfx.pet();
      app.save();
      app.ui.refresh();
    }
  }
});
stage.addEventListener('pointermove', (e) => {
  if (app.screen !== 'dive') return;
  const [x, y] = local(e);
  dive.pointerMove(x, y);
});
stage.addEventListener('pointerup', () => app.screen === 'dive' && dive.pointerUp());
stage.addEventListener('pointercancel', () => app.screen === 'dive' && dive.pointerCancel());
stage.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    track('session_end', { seconds: Math.round((Date.now() - app.sessionStart) / 1000), dives: app.sessionDives });
    app.save();
  } else {
    app.sessionStart = Date.now();
    app.sessionDives = 0;
    if (app.screen === 'home') app.goHome();
  }
});

// ------------------------------------------------------------ frame loop

let last = performance.now();
let clock = 0;

function titleVeil() {
  const { W, H } = view;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(10,8,31,.92)');
  g.addColorStop(0.34, 'rgba(10,8,31,.25)');
  g.addColorStop(0.62, 'rgba(10,8,31,.2)');
  g.addColorStop(1, 'rgba(10,8,31,.9)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // sparks drifting up out of the teapot
  additive(ctx, () => {
    for (let i = 0; i < 14; i++) {
      const k = (clock * 0.07 + i / 14) % 1;
      const x = W / 2 + Math.sin(i * 2.4 + clock * 0.5) * (30 + k * 110);
      const y = H * 0.66 - k * H * 0.5;
      glow(ctx, x, y, 5 + (1 - k) * 7, i % 3 ? '#ffcf5c' : '#7fe3d8', Math.sin(k * Math.PI) * 0.9);
    }
  });
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  clock += dt;
  setSlotDebug(slotsFromUrl || app.state.settings.artSlots);
  ctx.setTransform(view.px, 0, 0, view.px, 0, 0);
  if (app.screen === 'dive') {
    dive.update(dt);
    dive.draw(ctx, view.W, view.H, view.px);
  } else {
    app.world.update(dt);
    app.world.draw(ctx, view.W, view.H, view.px);
    if (app.screen === 'title') titleVeil();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Handy for playtests and automated checks; not used by the game itself.
window.__wonderlost = { app, view };
return {  };
})();
})();
</script>
